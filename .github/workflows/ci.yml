name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # experiments.typedRoutes (app.config.ts) checks every `href` against
      # .expo/types/router.d.ts. That file is gitignored and normally appears the first
      # time a dev server runs, so without this step CI has never seen it and a bad
      # route (e.g. `<Link href="/nope">`) typechecks clean here while still failing at
      # runtime. `expo customize tsconfig.json` runs the same route-typegen a dev server
      # would, one-shot, without starting Metro or a server.
      - name: Generate typed routes
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci
